name: Release

# Publish both workspace crates to crates.io using crates.io Trusted Publishing
# (OIDC) — no long-lived CARGO_REGISTRY_TOKEN secret. `rust-lang/crates-io-auth-action`
# exchanges the GitHub Actions OIDC token for a short-lived crates.io token that is
# automatically revoked when the job finishes.
#
# First publish (bootstrap):
#   Trusted Publishing can only be configured for a crate that ALREADY exists on
#   crates.io, so the very first publish of a brand-new crate cannot use OIDC.
#   Set a temporary `CARGO_REGISTRY_TOKEN` repo secret; the workflow uses it in
#   preference to OIDC. After both crates exist, register their trusted publishers
#   (below) and DELETE the secret — every later release then authenticates via OIDC.
#
# Prerequisites (one-time, on crates.io):
#   Register a Trusted Publisher for BOTH crates, pointing at this repo + this
#   workflow file ("release.yml"):
#     - camunda-orchestration-sdk
#     - camunda-orchestration-api-client
#   Trusted Publishing is per-crate, so both must be configured or the publish
#   step fails to authenticate for the missing one.
#
# Release flow:
#   Releases are cut by semantic-release in version.yml from the Conventional Commits
#   merged to `main` or `stable/**`. It bumps both crates, commits, and pushes the
#   `vX.Y.Z` tag. Do not bump versions or push release tags by hand.
#   The tag push triggers this workflow, which verifies the tag matches the crate
#   version, runs the test gate, then publishes the whole workspace atomically
#   (client first, then the SDK — cargo resolves the order).
#
#   `vN.0.0-alpha.0` tags are excluded: they only seed semantic-release's version
#   history on `main` for a new line and are never published.
#
# A manual `workflow_dispatch` run supports `dry_run: true` to exercise everything
# except the final upload.
#
# Before publishing a stable `N.x.y`, the API compatibility gate compares the code with
# the newest published N.x release (scripts/api_compat.py) and blocks a breaking change.
# Approve an intended break with the `api-break-approved` label on the PR that made it,
# merged into this release line since that release. A label approves the API as of that
# PR's merge, so a break added later needs its own. When no PR carries it (e.g. a direct
# push), re-run via workflow_dispatch with `api_break_approved: true` (the tag push itself
# cannot carry an approval). See scripts/api-compat-release-gate.sh.

on:
  push:
    tags:
      - 'v*'
      - '!v*.0.0-alpha.0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package + verify without uploading to crates.io'
        type: boolean
        default: true
      api_break_approved:
        description: 'Publish even though the public API breaks compatibility with the last release of this major'
        type: boolean
        default: false

concurrency:
  # One release at a time across tags, so each resolves its baseline after the previous one
  # has published. A newer run cancels a still-pending one: re-run it.
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for crates.io Trusted Publishing (OIDC)
  pull-requests: read  # API compatibility gate: find api-break-approved PRs

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Trusted Publishing can only be configured AFTER a crate first exists on
      # crates.io. For the initial publish of a brand-new crate, set a temporary
      # CARGO_REGISTRY_TOKEN secret; the workflow uses it in preference to OIDC.
      # Once both crates exist and their trusted publishers are registered, delete
      # the secret and every release authenticates via OIDC automatically.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # rust-toolchain.toml pins the channel + components; `rustup show` installs it.
      - name: Install pinned toolchain
        run: rustup show && rustc --version && cargo --version

      # For tag releases, fail fast if the tag does not match the crate version so we
      # never publish vX.Y.Z from a manifest still on a different version.
      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='camunda-orchestration-sdk'))")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version crate=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crate version $crate_version"
            exit 1
          fi

      - name: Test gate
        run: cargo test --workspace --locked

      - name: Install API compatibility tools
        run: ./scripts/install-api-compat-tools.sh

      # Blocks publishing an N.x.y whose public API breaks code compiled against the
      # newest published N.x release. The major comes from the version being released
      # (the trigger is a tag, not a branch); prereleases are not gated.
      - name: API compatibility gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.api_break_approved }}
        run: |
          set -uo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='camunda-orchestration-sdk'))")" || exit 2
          case "$version" in
            *-*)
              echo "::notice::${version} is a prerelease; the API compatibility gate only covers stable releases."
              exit 0
              ;;
          esac
          major="${version%%.*}"
          # The newest published release of this major on crates.io, not the nearest tag.
          baseline=$(python3 scripts/api_compat.py --print-baseline-major "$major") || exit 2
          if [ -z "$baseline" ]; then
            echo "::notice::No ${major}.x release published yet; nothing to compare against."
            exit 0
          fi
          echo "Releasing ${version}; baseline: ${baseline}"
          scripts/api-compat-release-gate.sh "$baseline" "$major"

      # OIDC auth is only needed when no bootstrap token is configured and we are
      # actually uploading. It fails unless a trusted publisher is registered for
      # every crate, so it is skipped during the token bootstrap and on dry-runs.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: ${{ env.HAS_TOKEN == 'false' && env.DRY_RUN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace
        env:
          # Prefer the bootstrap token if present, else the OIDC-exchanged token.
          # Empty on dry-run (cargo does not need a token then).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --workspace --locked --dry-run
          else
            cargo publish --workspace --locked
          fi

