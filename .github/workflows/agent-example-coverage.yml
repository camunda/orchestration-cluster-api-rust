# Resolves the auto-filed "Missing example coverage" issues (label `new-operations`)
# by running the Copilot CLI in CI and opening a pull request with the result.
#
# The mechanics live in camunda/sdk-infra so all five SDKs share one implementation;
# this file supplies only what is genuinely repo-specific: the toolchain to install
# and the commands that define "verified" here.

name: Agent — example coverage

on:
  issues:
    # `labeled` only: creating an issue with labels fires BOTH `opened` and
    # `labeled`, which would run the agent twice for every auto-filed issue.
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Coverage issue to work on (for re-runs).'
        required: true
        type: string

permissions: {}

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'new-operations')
    permissions:
      contents: read           # checkout; the app token does the pushing
      id-token: write          # mint GitHub OIDC token for Vault JWT auth
      copilot-requests: write  # Copilot CLI auth via GITHUB_TOKEN (billed to the org)
      issues: write            # report the outcome back on the issue
    uses: camunda/sdk-infra/.github/workflows/sdk-agent-example-coverage.yml@v1
    # Explicit rather than `inherit`: the shared workflow needs only Vault auth,
    # and this job hands the repo to an LLM agent.
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
      VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
      VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
    with:
      language: rust
      issue-number: ${{ github.event.issue.number || inputs.issue-number }}
      # Bundle first: the coverage check reads the spec committed in this repo, so
      # without a refresh it reports full coverage for operations that only exist
      # upstream — which is how a run in the Python SDK once closed a real gap as
      # already covered. `make check` is this repo's own gate; the coverage check is
      # not a make target here, so it is invoked the same way CI does.
      verify-commands: |
        make bundle-spec
        make check
        python3 "${SDK_INFRA}/scripts/check-example-coverage.py" --spec external-spec/bundled/rest-api.bundle.json --map examples/operation-map.json --examples-dir examples --key-style camelCase
      # The refresh above rewrites the bundle; `make check` re-resolves the
      # lockfile if a new example pulls in a dependency.
      verify-artifacts: |
        external-spec/bundled/**
        Cargo.lock
      extra-instructions: |
        The spec bundle under external-spec/ is a snapshot, not the live upstream spec.
        Run `make bundle-spec` before you trust any coverage result.

        If the refreshed spec exposes an operation that has no method on CamundaClient
        yet, run `make generate` — the runner image ships a JDK, so openapi-generator
        works here. Never hand-write into src/runtime/facade_generated.rs or client/:
        they are generated output, so changes to them should come from regeneration.
        Run `cargo fmt --all` afterwards — the generator does not format what it emits,
        so an unformatted regeneration shows up as thousands of lines of false drift.

        `examples/readme.rs` is the source of truth for the code blocks in `README.md`;
        edit the region there and run `make sync-readme` rather than editing `README.md`.
        Run `cargo fmt` before `make sync-readme`, otherwise rustfmt reflows the snippet
        source afterwards and the README goes out of sync.
